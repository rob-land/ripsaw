[package]
name = "ripsaw"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
license = "GPL-3.0-or-later"
description = "GTK4/libadwaita disc-ripping frontend for MakeMKV with TheDiscDB integration and 3D MVC support"
repository = "https://git.rob.land/rob/ripsaw"
readme = "README.md"

[[bin]]
name = "ripsaw"
path = "src/main.rs"

[lib]
name = "ripsaw"
path = "src/lib.rs"

[dependencies]
# UI
gtk = { package = "gtk4", version = "0.9", features = ["v4_14"] }
adw = { package = "libadwaita", version = "0.7", features = ["v1_6"] }
gio = "0.20"
glib = "0.20"

# Async runtime
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "fs", "io-util", "sync", "time"] }
async-channel = "2"
futures = "0.3"

# HTTP / GraphQL
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }

# Serialisation
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Disc metadata files (BDMV/META/DL/bdmt_eng.xml) on Blu-rays are XML --
# quick-xml is the standard streaming parser; tiny binary impact.
quick-xml = "0.36"

# Hashing (TheDiscDB content hash is MD5)
md-5 = "0.10"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Error handling
anyhow = "1"
thiserror = "2"

# Misc
once_cell = "1"
regex = "1"
url = "2"
which = "7"
tempfile = "3"

[build-dependencies]
glib-build-tools = "0.20"

[dev-dependencies]

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
